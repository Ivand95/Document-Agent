version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/usr/src/app  # Mount the current directory into the container
    ports:
      - "8000:8000"       # Map port 8000 of the container to port 8000 on the host
    environment:
      - PYTHONUNBUFFERED=1 # Ensure Python output is logged in real time
    command: >
      /bin/sh -c "source .venv/bin/activate && uv run app/agent.py"

  indexer:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - indexing_data:/data
    environment:
      - PYTHONUNBUFFERED=1
      - INDEXING_DATA_DIR=/data  # downloads + sync state survive restarts
    command: uv run python jobs/indexing.py

volumes:
  indexing_data:
